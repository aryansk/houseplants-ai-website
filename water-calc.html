<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Water Calculator · HousePlants</title>
<link rel="icon" href="/assets/app-icon.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
<div id="nav"></div>

<main style="max-width:48rem;margin:0 auto;padding:8rem 1.5rem 4rem">
  <header class="reveal">
    <p style="color:var(--leaf-300);font-weight:700;text-transform:uppercase;letter-spacing:.2em;font-size:.75rem">Tool</p>
    <h1 class="font-display" style="font-size:clamp(2.5rem,5vw,4rem);font-weight:900;margin:.5rem 0 0;line-height:1.05">Water calculator</h1>
    <p style="color:rgba(247,243,234,.7);margin-top:1rem">A personalized watering schedule based on plant type, pot size, light, and season.</p>
  </header>

  <form id="form" class="glass reveal" style="margin-top:2rem;padding:1.5rem;border-radius:1.5rem;display:grid;gap:1rem">
    <label style="display:grid;gap:.4rem"><span style="font-size:.75rem;font-weight:700;color:var(--leaf-300);text-transform:uppercase;letter-spacing:.15em">Plant name</span>
      <input id="plant" type="text" placeholder="e.g., Monstera" style="background:rgba(0,0,0,.25);border:1px solid rgba(247,243,234,.1);border-radius:.75rem;padding:.7rem 1rem;color:var(--cream)"/>
    </label>
    <div style="display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
      <label style="display:grid;gap:.4rem"><span style="font-size:.75rem;font-weight:700;color:var(--leaf-300);text-transform:uppercase;letter-spacing:.15em">Plant type</span>
        <select id="type" style="background:rgba(0,0,0,.25);border:1px solid rgba(247,243,234,.1);border-radius:.75rem;padding:.7rem 1rem;color:var(--cream)">
          <option value="aroid">Aroid (Monstera, Pothos…)</option>
          <option value="tropical">Tropical foliage</option>
          <option value="fern">Fern</option>
          <option value="palm">Palm</option>
          <option value="succulent">Succulent / Cactus</option>
          <option value="flowering">Flowering</option>
        </select>
      </label>
      <label style="display:grid;gap:.4rem"><span style="font-size:.75rem;font-weight:700;color:var(--leaf-300);text-transform:uppercase;letter-spacing:.15em">Pot diameter (cm)</span>
        <input id="pot" type="number" value="15" min="5" max="60" style="background:rgba(0,0,0,.25);border:1px solid rgba(247,243,234,.1);border-radius:.75rem;padding:.7rem 1rem;color:var(--cream)"/>
      </label>
      <label style="display:grid;gap:.4rem"><span style="font-size:.75rem;font-weight:700;color:var(--leaf-300);text-transform:uppercase;letter-spacing:.15em">Light level</span>
        <select id="light" style="background:rgba(0,0,0,.25);border:1px solid rgba(247,243,234,.1);border-radius:.75rem;padding:.7rem 1rem;color:var(--cream)">
          <option value="low">Low</option>
          <option value="bright" selected>Bright indirect</option>
          <option value="direct">Direct sun</option>
        </select>
      </label>
      <label style="display:grid;gap:.4rem"><span style="font-size:.75rem;font-weight:700;color:var(--leaf-300);text-transform:uppercase;letter-spacing:.15em">Season</span>
        <select id="season" style="background:rgba(0,0,0,.25);border:1px solid rgba(247,243,234,.1);border-radius:.75rem;padding:.7rem 1rem;color:var(--cream)">
          <option value="spring">Spring</option>
          <option value="summer" selected>Summer</option>
          <option value="autumn">Autumn</option>
          <option value="winter">Winter</option>
        </select>
      </label>
    </div>
  </form>

  <section id="out" style="margin-top:2rem"></section>
</main>

<div id="footer"></div>
<script src="/assets/site.js"></script>
<script>
const params = new URLSearchParams(location.search);
if (params.get('plant')) document.getElementById('plant').value = params.get('plant');

const TYPE_BASE = { aroid:7, tropical:6, fern:4, palm:8, succulent:18, flowering:5 }; // base days between watering
const LIGHT_MOD  = { low:1.4, bright:1.0, direct:0.75 };
const SEASON_MOD = { spring:1.0, summer:0.85, autumn:1.1, winter:1.4 };

function calc(){
  const t = document.getElementById('type').value;
  const pot = +document.getElementById('pot').value || 15;
  const light = document.getElementById('light').value;
  const season = document.getElementById('season').value;
  const plant = document.getElementById('plant').value.trim() || 'Your plant';

  // Days between waterings
  let days = TYPE_BASE[t] * LIGHT_MOD[light] * SEASON_MOD[season];
  // Pot scaling: larger pots hold more water (linear-ish in diameter)
  days *= (pot / 15);
  days = Math.max(2, Math.round(days));

  // Volume estimate: rough rule ~ 10% of pot volume per watering, pot vol ~ (d/2)^2 * d * π
  const r = pot/2;
  const potVolMl = Math.PI * r*r * pot; // cm^3 ≈ ml
  const waterMl = Math.round(potVolMl * 0.10);

  // 4-week schedule
  const today = new Date();
  const dates = [];
  for (let i=0; i<4; i++){
    const d = new Date(today.getTime() + days*i*86400000);
    dates.push(d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' }));
  }

  document.getElementById('out').innerHTML = `
    <div class="glass" style="padding:1.5rem;border-radius:1.5rem">
      <p style="font-size:.75rem;color:var(--leaf-300);font-weight:700;text-transform:uppercase;letter-spacing:.15em">${plant}'s plan</p>
      <h2 class="font-display" style="font-size:2.5rem;font-weight:900;margin:.25rem 0">Every <span class="gradient-text">${days} days</span></h2>
      <p style="color:rgba(247,243,234,.7)">~${waterMl} ml per watering. Always check the top inch of soil before pouring — that overrides any schedule.</p>

      <div style="margin-top:1.5rem;display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
        ${dates.map((d,i)=>`<div style="background:rgba(0,0,0,.25);padding:1rem;border-radius:1rem">
          <p style="font-size:.7rem;color:var(--leaf-300);font-weight:700;text-transform:uppercase">Watering ${i+1}</p>
          <p style="font-weight:800;font-size:1.05rem;margin-top:.25rem">${d}</p>
          <p style="color:rgba(247,243,234,.6);font-size:.8rem;margin-top:.25rem">~${waterMl} ml</p>
        </div>`).join('')}
      </div>

      <div style="margin-top:1.5rem;padding:1rem;border-radius:1rem;background:rgba(92,183,113,.1);border:1px solid rgba(92,183,113,.3)">
        <p style="font-size:.8rem;font-weight:700;color:var(--leaf-300)">Pro tip</p>
        <p style="margin-top:.25rem;font-size:.9rem">Water until it runs from the drainage hole, then empty the saucer after 15 minutes. Standing water is the #1 cause of root rot.</p>
      </div>
    </div>
  `;
}
document.getElementById('form').addEventListener('input', calc);
calc();
</script>
</body>
</html>
