<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Plant · HousePlants</title>
<meta name="description" content="View care requirements, botanical classifications, watering tips, and pet compatibility profiles for individual houseplants." />
<link rel="icon" href="/assets/app-icon.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,700;9..144,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
<div id="nav"></div>

<main id="main" style="max-width:64rem;margin:0 auto;padding:8rem 1.5rem 4rem">
  <p style="color:rgba(247,243,234,.6)">Loading…</p>
</main>

<div id="footer"></div>
<script src="/assets/site.js"></script>
<script>
const params = new URLSearchParams(location.search);
const id = parseInt(params.get('id'), 10);

function careText(level){
  const map = {
    'Easy':'Tolerant and forgiving. Great for beginners.',
    'Moderate':'Requires consistent attention to thrive.',
    'Difficult':'Demands a calibrated environment.',
    'Hard':'Demands a calibrated environment.'
  };
  return map[level] || 'A rewarding plant for committed growers.';
}

function waterTips(level){
  return {
    'Low':'Water sparingly — let soil dry out fully between waterings.',
    'Moderate':'Top inch of soil should dry between waterings. Typically weekly.',
    'High':'Keep evenly moist. Check soil every 2-3 days.',
    'Frequent':'Keep evenly moist. Check soil every 2-3 days.'
  }[level] || 'Check the soil before watering — finger an inch in.';
}

function lightTips(level){
  return {
    'Low':'Tolerates north-facing windows or interior corners.',
    'Bright Indirect':'East/west window with sheer light. No direct sun.',
    'Direct Sun':'South-facing window or outdoor patio. 6+ hours sun.',
    'Medium':'A few feet from a bright window.'
  }[level] || 'Place where light is appropriate for the species.';
}

loadPlants().then(plants => {
  const p = plants.find(x => x.id === id);
  const main = document.getElementById('main');
  if (!p) {
    main.innerHTML = `<h1 class="font-display" style="font-size:3rem;font-weight:900">Plant not found</h1>
      <p style="color:rgba(247,243,234,.7);margin-top:1rem">No plant with id ${id||'(none)'}. <a href="/catalog.html" style="color:var(--leaf-300)">Browse the catalog →</a></p>`;
    document.title = 'Not found · HousePlants';
    return;
  }
  document.title = `${p.common_name} · HousePlants`;
  const img = plantImage(p);
  const visual = img
    ? `<img src="${img}" alt="${p.common_name}" style="width:100%;height:100%;object-fit:cover" />`
    : `<div style="display:grid;place-items:center;width:100%;height:100%;font-size:8rem">${plantEmoji(p)}</div>`;
  const isToxic = (p.toxicity||'').toLowerCase().includes('toxic');

  // related: 4 plants sharing genus or care
  const related = plants
    .filter(x => x.id !== p.id && (x.genus === p.genus || x.care_difficulty === p.care_difficulty))
    .slice(0, 6);

  main.innerHTML = `
    <a href="/catalog.html" style="color:rgba(247,243,234,.6);text-decoration:none;font-size:.875rem">← Back to catalog</a>
    <div class="reveal in" style="margin-top:1rem;display:grid;grid-template-columns:1fr;gap:2.5rem">
      <div style="display:grid;grid-template-columns:1fr;gap:2.5rem;@media(min-width:768px){grid-template-columns:1fr 1fr}" class="hero-grid">
        <div style="aspect-ratio:1/1;background:var(--leaf-800);border-radius:2rem;overflow:hidden;position:relative">
          ${visual}
          <span class="tag ${isToxic?'toxic':'safe'}" style="position:absolute;top:1rem;left:1rem">${isToxic?'⚠':'✓'} ${p.toxicity||'Safety unknown'}</span>
        </div>
        <div>
          <p style="color:var(--leaf-300);font-weight:700;text-transform:uppercase;letter-spacing:.2em;font-size:.75rem">${p.category||'Plant'} · ${p.care_difficulty||''}</p>
          <h1 class="font-display" style="font-size:clamp(2.5rem,5vw,4rem);font-weight:900;margin:.5rem 0 0;line-height:1.05">${p.common_name}</h1>
          <p style="color:rgba(247,243,234,.6);font-style:italic;margin-top:.3rem">${p.genus||''}</p>
          <p style="color:rgba(247,243,234,.75);margin-top:1.5rem;line-height:1.6">${careText(p.care_difficulty)}</p>

          <div style="margin-top:1.5rem;display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem">
            <div class="glass" style="padding:1rem;border-radius:1rem"><p style="font-size:.7rem;text-transform:uppercase;letter-spacing:.15em;color:var(--leaf-300);font-weight:700">Light</p><p style="font-weight:700;margin-top:.25rem">${p.light_requirements||'—'}</p></div>
            <div class="glass" style="padding:1rem;border-radius:1rem"><p style="font-size:.7rem;text-transform:uppercase;letter-spacing:.15em;color:var(--leaf-300);font-weight:700">Water</p><p style="font-weight:700;margin-top:.25rem">${p.watering_needs||'—'}</p></div>
            <div class="glass" style="padding:1rem;border-radius:1rem"><p style="font-size:.7rem;text-transform:uppercase;letter-spacing:.15em;color:var(--leaf-300);font-weight:700">Care level</p><p style="font-weight:700;margin-top:.25rem">${p.care_difficulty||'—'}</p></div>
            <div class="glass" style="padding:1rem;border-radius:1rem"><p style="font-size:.7rem;text-transform:uppercase;letter-spacing:.15em;color:var(--leaf-300);font-weight:700">Category</p><p style="font-weight:700;margin-top:.25rem">${p.category||'—'}</p></div>
          </div>

          <div style="margin-top:1.5rem;display:flex;gap:.75rem;flex-wrap:wrap">
            <a href="/water-calc.html?plant=${encodeURIComponent(p.common_name)}" class="btn btn-primary">💧 Watering plan</a>
            <a href="/doctor.html" class="btn btn-ghost">🩺 Diagnose</a>
          </div>
        </div>
      </div>

      <section>
        <h2 class="font-display" style="font-size:2rem;font-weight:900">Care guide</h2>
        <div style="margin-top:1rem;display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
          <div class="glass" style="padding:1.25rem;border-radius:1.25rem"><h3 style="font-weight:700">☀ Light</h3><p style="color:rgba(247,243,234,.7);margin-top:.5rem;font-size:.9rem">${lightTips(p.light_requirements)}</p></div>
          <div class="glass" style="padding:1.25rem;border-radius:1.25rem"><h3 style="font-weight:700">💧 Water</h3><p style="color:rgba(247,243,234,.7);margin-top:.5rem;font-size:.9rem">${waterTips(p.watering_needs)}</p></div>
          <div class="glass" style="padding:1.25rem;border-radius:1.25rem"><h3 style="font-weight:700">🌡 Temperature</h3><p style="color:rgba(247,243,234,.7);margin-top:.5rem;font-size:.9rem">Most ${p.category?.toLowerCase()||'indoor'} plants prefer 18–27 °C and avoid cold drafts.</p></div>
          <div class="glass" style="padding:1.25rem;border-radius:1.25rem"><h3 style="font-weight:700">🪴 Repotting</h3><p style="color:rgba(247,243,234,.7);margin-top:.5rem;font-size:.9rem">Every 1–2 years, sizing up by one pot diameter. Refresh soil annually.</p></div>
          <div class="glass" style="padding:1.25rem;border-radius:1.25rem"><h3 style="font-weight:700">🐾 Safety</h3><p style="color:rgba(247,243,234,.7);margin-top:.5rem;font-size:.9rem">${isToxic?'Keep away from cats, dogs, and small children. Sap and leaves can irritate.':'Generally considered safe around pets and children — still avoid ingestion.'}</p></div>
          <div class="glass" style="padding:1.25rem;border-radius:1.25rem"><h3 style="font-weight:700">🌱 Propagation</h3><p style="color:rgba(247,243,234,.7);margin-top:.5rem;font-size:.9rem">Most members of ${p.genus||'this genus'} propagate by stem cuttings or division. See the in-app Propagation Station for steps.</p></div>
        </div>
      </section>

      ${related.length ? `
      <section>
        <h2 class="font-display" style="font-size:2rem;font-weight:900">You may also like</h2>
        <div style="margin-top:1rem;display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">
          ${related.map(r => {
            const ri = plantImage(r);
            return `<a href="/plant.html?id=${r.id}" class="tilt" style="text-decoration:none;color:inherit;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:1rem;overflow:hidden;display:block">
              <div class="plant-thumb" style="border-radius:0">${ri?`<img src="${ri}" alt="" loading="lazy"/>`:`<span>${plantEmoji(r)}</span>`}</div>
              <div style="padding:.75rem"><p style="font-weight:700;font-size:.85rem;line-height:1.2">${r.common_name}</p></div>
            </a>`;
          }).join('')}
        </div>
      </section>` : ''}
    </div>

    <style>@media(min-width:768px){.hero-grid{grid-template-columns:1fr 1fr !important}}</style>
  `;
});
</script>
</body>
</html>
