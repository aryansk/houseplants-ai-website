<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Plant · HousePlants</title>
<meta name="description" content="View care requirements, botanical classifications, watering tips, and pet compatibility profiles for individual houseplants." />
<!-- Per-plant content now lives at /plants/<slug>; this page just forwards
     legacy ?id= links there, so keep it out of the index. -->
<meta name="robots" content="noindex" />
<link rel="icon" href="/assets/app-icon.png" />
<link rel="apple-touch-icon" href="/assets/app-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="nav"></div>

<main id="main" style="max-width:64rem;margin:0 auto;padding:8rem 1.5rem 4rem">
  <p style="color:rgba(17,17,17,.6)">Loading…</p>
</main>

<div id="footer"></div>
<script src="/assets/plant-info.js"></script>
<script src="/assets/site.js"></script>
<script>
const params = new URLSearchParams(location.search);
const id = parseInt(params.get('id'), 10);

loadPlants().then(plants => {
  const p = plants.find(x => x.id === id);
  if (p) {
    // Forward to the canonical, pre-rendered plant page.
    location.replace('/plants/' + PlantInfo.slugify(p.common_name));
    return;
  }
  document.title = 'Not found · HousePlants';
  document.getElementById('main').innerHTML =
    `<h1 class="font-display" style="font-size:3rem;font-weight:900">Plant not found</h1>
     <p style="color:rgba(17,17,17,.7);margin-top:1rem">No plant with id ${id || '(none)'}.
       <a href="/catalog" style="color:var(--mond-red)">Browse the catalog →</a></p>`;
});
</script>
</body>
</html>
